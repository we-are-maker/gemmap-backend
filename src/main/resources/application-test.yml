spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# CORS 설정 (테스트용)
cors:
  allowed-origins: "*"
  max-age: 3600

# JWT 토큰 설정 (테스트용)
jwt:
  secret: "dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcy1zaG91bGQtYmUtYXQtbGVhc3QtMjU2LWJpdHM="
  access-token-expiration: 7200000    # 2시간
  refresh-token-expiration: 604800000 # 7일

# OAuth2 설정 (테스트용)
oauth2:
  kakao:
    client-id: "test-kakao-client-id"
    client-secret: "test-kakao-client-secret"
    redirect-uri: "http://localhost:8080/api/v1/auth/kakao/callback"
    app-id: 1234567890

# S3 설정 (테스트용 - OCI S3 호환 모드)
s3:
  credentials:
    access-key: "test-access-key"
    secret-key: "test-secret-key"
  endpoint: "http://localhost:9000"
  storage-url: "http://localhost:9000"
  region:
    name: "kr-1"
  bucket: "test-bucket"
  base-path: "test/"