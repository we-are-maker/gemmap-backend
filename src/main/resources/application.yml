spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  max-age: ${CORS_MAX_AGE}

# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}    # 2시간 (기본값)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION} # 7일 (기본값)

# OAuth2 설정 (카카오)
oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    app-id: ${KAKAO_APP_ID}

# OCI Object Storage 설정 (S3 호환)
s3:
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  endpoint: ${S3_ENDPOINT}
  region:
    name: ${S3_REGION}
  bucket: ${S3_BUCKET}
  base-path: ${S3_BASE_PATH}
  path-style-access-enabled: true