spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Seoul
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  max-age: ${CORS_MAX_AGE}

# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}    # 2시간 (기본값)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION} # 7일 (기본값)

# OAuth2 설정 (카카오)
oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    app-id: ${KAKAO_APP_ID}
    admin-key: ${KAKAO_ADMIN_KEY}
  apple:
    bundle-id: ${APPLE_BUNDLE_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}

# 암호화 설정 — Spring Security Encryptors.text (AES-256-CBC + 랜덤 IV)
crypto:
  apple-refresh-token:
    enc-password: ${APPLE_REFRESH_TOKEN_ENC_PASSWORD}
    enc-salt: ${APPLE_REFRESH_TOKEN_ENC_SALT}

# 회원 탈퇴 후 재가입 정책
withdraw:
  rejoin-grace-period-days: 30   # 탈퇴 후 N일 이내 재로그인 → 데이터 유지 복구. 경과 시 권한·프로필 초기화

# AWS S3 설정
s3:
  region:
    name: ${S3_REGION}
  bucket: ${S3_BUCKET}
  base-path: ${S3_BASE_PATH}
