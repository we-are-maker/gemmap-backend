name: CD - Deploy to AWS Dev

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker"]
    types: [completed]

jobs:
  deploy-dev:
    name: Deploy to AWS EC2 Dev
    runs-on: ubuntu-latest

    # CI 성공 + develop 브랜치일 때만 배포
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'

    steps:
      # 1. 워크플로우 디버깅용
      - name: Print workflow_run info
        run: |
          echo "workflow:   ${{ github.event.workflow_run.name }}"
          echo "branch:     ${{ github.event.workflow_run.head_branch }}"
          echo "conclusion: ${{ github.event.workflow_run.conclusion }}"

      # 2. EC2에 .env 파일 생성 (GitHub Secrets → EC2 파일)
      - name: Write .env to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            set -eux
            cat > /opt/gemmap/.env << 'DOTENV_EOF'
            SPRING_PROFILES_ACTIVE=dev
            TZ=Asia/Seoul

            DB_HOST=mysql
            DB_PORT=3306
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ACCESS_TOKEN_EXPIRATION=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
            JWT_REFRESH_TOKEN_EXPIRATION=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            KAKAO_APP_ID=${{ secrets.KAKAO_APP_ID }}
            KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}

            APPLE_BUNDLE_ID=${{ secrets.APPLE_BUNDLE_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
            APPLE_REFRESH_TOKEN_ENC_PASSWORD=${{ secrets.APPLE_REFRESH_TOKEN_ENC_PASSWORD }}
            APPLE_REFRESH_TOKEN_ENC_SALT=${{ secrets.APPLE_REFRESH_TOKEN_ENC_SALT }}

            S3_REGION=ap-northeast-2
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_BASE_PATH=${{ secrets.S3_BASE_PATH }}

            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            CORS_MAX_AGE=${{ secrets.CORS_MAX_AGE }}
            DOTENV_EOF
            chmod 600 /opt/gemmap/.env

      # 3. Docker Hub 로그인
      - name: Docker login on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            set -eux
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. 최신 이미지 Pull
      - name: Pull latest dev image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            set -eux
            cd /opt/gemmap
            sudo docker compose pull app

      # 5. 앱 컨테이너만 재기동 (MySQL 볼륨 유지)
      - name: Restart app container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            set -eux
            cd /opt/gemmap
            sudo docker compose up -d app

      # 6. 오래된 이미지 정리
      - name: Prune old Docker images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            set -eux
            sudo docker image prune -f