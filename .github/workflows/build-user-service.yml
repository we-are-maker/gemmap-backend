name: Build & Deploy User Service

on:
  push:
    branches:
      - develop
    paths:
      - 'services/user-service/**'
      - 'libs/**'
      - '.github/workflows/build-user-service.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'services/user-service/**'
      - 'libs/**'
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test user-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build user-service (includes test)
        run: |
          ./gradlew :services:user-service:clean :services:user-service:build --no-daemon

  build-push-image:
    name: Build & Push user-service Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      REGISTRY: docker.io
      IMAGE_NAME: gemmap/user-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Short SHA
        id: meta
        shell: bash
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image using Gradle bootBuildImage
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          ./gradlew :services:user-service:bootBuildImage \
            --imageName=$REGISTRY/$IMAGE_NAME:dev-$SHA7 \
            --no-daemon

      - name: Tag as dev-latest
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          docker tag $REGISTRY/$IMAGE_NAME:dev-$SHA7 $REGISTRY/$IMAGE_NAME:dev-latest

      - name: Push Docker Images
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          docker push $REGISTRY/$IMAGE_NAME:dev-$SHA7
          docker push $REGISTRY/$IMAGE_NAME:dev-latest