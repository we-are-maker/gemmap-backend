name: CI - Build & Push Docker

on:
  push:
    branches:
      - develop
      # - main   # prod 릴리스 규칙 정립 후 주석 해제
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (PR/Push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build (includes test)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean build --no-daemon
          else
            echo "No Gradle wrapper found. Skipping Java build."
          fi

  publish-image:
    name: Build & Push Docker Image (develop push only)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      REGISTRY: docker.io
      IMAGE_NAME: gemmap/gemmap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Short SHA
        id: meta
        shell: bash
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Tag
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          docker build \
            -t $REGISTRY/$IMAGE_NAME:dev-$SHA7 \
            -t $REGISTRY/$IMAGE_NAME:dev-latest \
            .

      - name: Push
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          docker push $REGISTRY/$IMAGE_NAME:dev-$SHA7
          docker push $REGISTRY/$IMAGE_NAME:dev-latest

      - name: Trigger NHN Cloud Pipeline (dev)
        env:
          WEBHOOK_URL: ${{ secrets.NHN_WEBHOOK_URL_DEV }}
          IMAGE_URI:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
        run: |
          set -eux
          curl -X POST -H "Content-Type: application/json" \
            -d '{"ref":"develop","image":"'"$IMAGE_URI"'"}' \
            "$WEBHOOK_URL"