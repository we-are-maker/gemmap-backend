name: CI - Build & Push Docker

on:
  push:
    branches:
      - develop
      # - main   # prod 릴리스 규칙 정립 후 주석 해제
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build (PR/Push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build (excludes test)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean build -x test --no-daemon
          else
            echo "No Gradle wrapper found. Skipping Java build."
          fi

  publish-image:
    name: Build & Push Docker Image (develop push only)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      REGISTRY: docker.io
      IMAGE_NAME: gemmap/gemmap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Short SHA
        id: meta
        shell: bash
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Tag
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          docker build \
            -t $REGISTRY/$IMAGE_NAME:dev-$SHA7 \
            -t $REGISTRY/$IMAGE_NAME:dev-latest \
            .

      - name: Push
        env:
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          set -eux
          docker push $REGISTRY/$IMAGE_NAME:dev-$SHA7
          docker push $REGISTRY/$IMAGE_NAME:dev-latest

      - name: Execute NHN Cloud Pipeline via Anchor API (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          NHN_REGION: KR1
          NHN_APPKEY: ${{ secrets.NHN_APPKEY }}
          NHN_AUTH_ID: ${{ secrets.NHN_USER_ACCESS_KEY_ID }}
          NHN_AUTH_SECRET: ${{ secrets.NHN_USER_ACCESS_KEY_SECRET }}
          NHN_PIPELINE: contest11-dev-pipeline
        run: |
          set -eux
          curl --fail --show-error --location --max-time 20 -i -X POST \
            -H "Content-Type:application/json" \
            -H "X-NHN-REGION:KR1" \
            -H "X-TC-AUTHENTICATION-ID:${NHN_AUTH_ID}" \
            -H "X-TC-AUTHENTICATION-SECRET:${NHN_AUTH_SECRET}" \
            -H "X-NHN-APPKEY:${NHN_APPKEY}" \
            "https://kr1-pipeline.api.nhncloudservice.com/api/anchor/v1.0/pipelines/${NHN_PIPELINE}/execute"