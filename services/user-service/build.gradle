plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'java'
}

description = 'User Service - Handles authentication and user management'

// This service is bootable
bootJar {
	enabled = true
}

jar {
	enabled = false
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:2.20.28"
	}
}

dependencies {
	// Common libraries
	implementation project(':libs:common-core')
	implementation project(':libs:common-security-jwt')

	// Spring Boot starters
	implementation libs.spring.boot.starter.web
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.validation
	implementation libs.spring.boot.starter.webflux
	implementation libs.spring.boot.starter.oauth2.resource.server

	// Database
	runtimeOnly libs.mysql.connector
	testRuntimeOnly libs.h2

	// Lombok
	compileOnly libs.lombok
	annotationProcessor libs.lombok

	// Testing
	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.security.test
	testRuntimeOnly libs.junit.platform.launcher
}
