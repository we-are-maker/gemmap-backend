plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'java'
}

description = 'Spot Service - Handles spot/place management and image processing'

// This service is bootable
bootJar {
	enabled = true
}

jar {
	enabled = false
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:2.20.28"
	}
}

dependencies {
	// Common libraries
	implementation project(':libs:common-core')
	implementation project(':libs:common-security-jwt')

	// Spring Boot starters
	implementation libs.spring.boot.starter.web
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.validation

	// Database
	runtimeOnly libs.mysql.connector
	testRuntimeOnly libs.h2

	// Lombok
	compileOnly libs.lombok
	annotationProcessor libs.lombok

	// AWS S3 SDK for NHN Object Storage
	implementation libs.aws.s3

	// Metadata extractor for EXIF
	implementation libs.metadata.extractor

	// Hibernate Spatial for Point type
	implementation libs.hibernate.spatial

	// Testing
	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.security.test
	testRuntimeOnly libs.junit.platform.launcher
}
