plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

description = 'Common core library for shared utilities, DTOs, and domain models'

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.4"
	}
}

dependencies {
	// Lombok for reducing boilerplate
	compileOnly libs.lombok
	annotationProcessor libs.lombok

	// Jackson for JSON processing
	api libs.jackson.databind

	// Spring Web (for controllers, REST, exception handlers)
	compileOnly libs.spring.boot.starter.web

	// Spring Data JPA (for DAO exceptions)
	compileOnly libs.spring.boot.starter.data.jpa

	// Spring Security (for authentication/authorization utilities)
	compileOnly libs.spring.boot.starter.security

	// JWT (for JwtException in GlobalExceptionHandler)
	compileOnly libs.jwt.api

	// JPA annotations (for shared entities)
	compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	// Validation annotations
	compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'

	// Servlet API (for HttpServletRequest)
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

	// SLF4J (for logging)
	compileOnly 'org.slf4j:slf4j-api'
}
